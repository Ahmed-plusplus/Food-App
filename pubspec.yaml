name: food_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  get_it: ^9.3.0
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf